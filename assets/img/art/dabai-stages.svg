<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img"
     aria-labelledby="t d">
  <title id="t">Dabai 生長四階段插畫</title>
  <desc id="d">開花期、幼果期、成熟期、採收期。這四個階段就是溝通者現場回報時要選的那四項。依實物配色繪製的插畫，非攝影。</desc>

  <defs>
    <radialGradient id="sYoung" cx="38%" cy="30%" r="74%">
      <stop offset="0%"  stop-color="#8FA86A"/>
      <stop offset="100%" stop-color="#54703C"/>
    </radialGradient>
    <radialGradient id="sTurn" cx="38%" cy="30%" r="74%">
      <stop offset="0%"  stop-color="#8A6A6E"/>
      <stop offset="100%" stop-color="#4A3244"/>
    </radialGradient>
    <radialGradient id="sRipe" cx="36%" cy="28%" r="76%">
      <stop offset="0%"  stop-color="#5B3A52"/>
      <stop offset="45%" stop-color="#31203A"/>
      <stop offset="100%" stop-color="#150D19"/>
    </radialGradient>
    <linearGradient id="sLeaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#54805A"/>
      <stop offset="100%" stop-color="#2C4A31"/>
    </linearGradient>
  </defs>

  <!-- ① 開花期 -->
  <g transform="translate(80 96)">
    <path d="M0 46 L0 -6" stroke="#6B4A2A" stroke-width="6" stroke-linecap="round"/>
    <path d="M0 8 C -22 -6, -44 -2, -52 8 C -36 22, -12 20, 0 8 Z" fill="url(#sLeaf)"/>
    <g fill="#F6EBC8">
      <circle cx="-14" cy="-22" r="7"/><circle cx="2"  cy="-32" r="8"/>
      <circle cx="17"  cy="-20" r="6.5"/><circle cx="-2" cy="-12" r="6"/>
    </g>
    <g fill="#D89B33">
      <circle cx="-14" cy="-22" r="2.4"/><circle cx="2" cy="-32" r="2.8"/>
      <circle cx="17"  cy="-20" r="2.2"/><circle cx="-2" cy="-12" r="2"/>
    </g>
    <text x="0" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#4A443A"
          font-family="system-ui,-apple-system,'Noto Sans TC',sans-serif">開花期</text>
  </g>

  <!-- ② 幼果期 -->
  <g transform="translate(240 96)">
    <path d="M0 46 L0 -4" stroke="#6B4A2A" stroke-width="6" stroke-linecap="round"/>
    <path d="M0 10 C -22 -4, -44 0, -52 10 C -36 24, -12 22, 0 10 Z" fill="url(#sLeaf)"/>
    <ellipse cx="-12" cy="-16" rx="10" ry="13" fill="url(#sYoung)"/>
    <ellipse cx="10"  cy="-24" rx="11" ry="14" fill="url(#sYoung)"/>
    <ellipse cx="4"   cy="-2"  rx="9"  ry="12" fill="url(#sYoung)"/>
    <text x="0" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#4A443A"
          font-family="system-ui,-apple-system,'Noto Sans TC',sans-serif">幼果期</text>
  </g>

  <!-- ③ 成熟期（轉色中） -->
  <g transform="translate(400 96)">
    <path d="M0 46 L0 -4" stroke="#6B4A2A" stroke-width="6" stroke-linecap="round"/>
    <path d="M0 10 C -22 -4, -44 0, -52 10 C -36 24, -12 22, 0 10 Z" fill="url(#sLeaf)"/>
    <ellipse cx="-13" cy="-18" rx="13" ry="17" fill="url(#sTurn)"/>
    <ellipse cx="12"  cy="-26" rx="14" ry="18" fill="url(#sRipe)"/>
    <ellipse cx="12"  cy="-42" rx="5"  ry="2.5" fill="#D89B33"/>
    <ellipse cx="5"   cy="0"   rx="12" ry="16" fill="url(#sTurn)"/>
    <text x="0" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#4A443A"
          font-family="system-ui,-apple-system,'Noto Sans TC',sans-serif">成熟期</text>
  </g>

  <!-- ④ 採收期：進了籃子 -->
  <g transform="translate(560 96)">
    <g>
      <ellipse cx="-14" cy="-16" rx="13" ry="17" fill="url(#sRipe)"/>
      <ellipse cx="-14" cy="-31" rx="5" ry="2.5" fill="#D89B33"/>
      <ellipse cx="12"  cy="-20" rx="14" ry="18" fill="url(#sRipe)"/>
      <ellipse cx="12"  cy="-36" rx="5" ry="2.5" fill="#D89B33"/>
      <ellipse cx="0"   cy="-2"  rx="13" ry="17" fill="url(#sRipe)"/>
    </g>
    <!-- 藤籃 -->
    <path d="M-40 4 L40 4 L30 44 L-30 44 Z" fill="#B98A50"/>
    <path d="M-40 4 L40 4 L38 12 L-38 12 Z" fill="#8E6636"/>
    <g stroke="#8E6636" stroke-width="2" opacity=".55">
      <path d="M-24 12 L-20 44"/><path d="M-8 12 L-6 44"/>
      <path d="M8 12 L6 44"/><path d="M24 12 L20 44"/>
    </g>
    <text x="0" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#4A443A"
          font-family="system-ui,-apple-system,'Noto Sans TC',sans-serif">採收期</text>
  </g>
</svg>
