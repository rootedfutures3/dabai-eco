<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img"
     aria-labelledby="t d">
  <title id="t">結果中的 Dabai 枝條插畫</title>
  <desc id="d">一段枝條上成串的 Dabai 與羽狀複葉。依實物比例與配色繪製的插畫，非攝影。</desc>

  <defs>
    <radialGradient id="bskin" cx="36%" cy="30%" r="76%">
      <stop offset="0%"  stop-color="#5B3A52"/>
      <stop offset="44%" stop-color="#311F38"/>
      <stop offset="100%" stop-color="#140C18"/>
    </radialGradient>
    <linearGradient id="bleaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#54805A"/>
      <stop offset="100%" stop-color="#2C4A31"/>
    </linearGradient>
    <linearGradient id="bleaf2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#6B9463"/>
      <stop offset="100%" stop-color="#3A6038"/>
    </linearGradient>
  </defs>

  <!-- 主枝 -->
  <path d="M14 58 C 120 76, 210 104, 300 150 C 342 172, 372 198, 396 226"
        fill="none" stroke="#6B4A2A" stroke-width="11" stroke-linecap="round"/>
  <path d="M14 58 C 120 76, 210 104, 300 150" fill="none"
        stroke="#8C6438" stroke-width="4" stroke-linecap="round" opacity=".7"/>

  <!-- 羽狀複葉：沿著枝條左右各生一組 -->
  <g opacity=".95">
    <path d="M78 70 C 58 34, 20 22, 4 30 C 20 68, 58 82, 78 70 Z" fill="url(#bleaf)"/>
    <path d="M112 82 C 108 44, 78 16, 58 14 C 62 56, 90 82, 112 82 Z" fill="url(#bleaf2)"/>
    <path d="M186 106 C 190 66, 168 34, 148 28 C 144 70, 164 100, 186 106 Z" fill="url(#bleaf)"/>
    <path d="M232 126 C 254 96, 254 56, 240 40 C 216 66, 212 106, 232 126 Z" fill="url(#bleaf2)"/>
    <path d="M312 168 C 344 152, 366 118, 362 98 C 330 114, 308 146, 312 168 Z" fill="url(#bleaf)"/>
  </g>

  <!-- 果串：Dabai 是成串結果的，大小略有差異才自然 -->
  <g>
    <!-- 每顆果：果身 + 高光 + 黃橘蒂頭 -->
    <g transform="translate(150 150)">
      <ellipse rx="26" ry="34" fill="url(#bskin)"/>
      <ellipse cx="-9" cy="-12" rx="8" ry="14" fill="#B98FA8" opacity=".18" transform="rotate(-18)"/>
      <ellipse cy="-31" rx="8" ry="4" fill="#D89B33"/>
    </g>
    <g transform="translate(206 186)">
      <ellipse rx="29" ry="38" fill="url(#bskin)"/>
      <ellipse cx="-10" cy="-14" rx="9" ry="15" fill="#B98FA8" opacity=".18" transform="rotate(-18)"/>
      <ellipse cy="-35" rx="9" ry="4.5" fill="#D89B33"/>
    </g>
    <g transform="translate(262 224)">
      <ellipse rx="24" ry="32" fill="url(#bskin)"/>
      <ellipse cx="-8" cy="-11" rx="7" ry="13" fill="#B98FA8" opacity=".18" transform="rotate(-18)"/>
      <ellipse cy="-29" rx="7.5" ry="4" fill="#D89B33"/>
    </g>
    <g transform="translate(196 258)">
      <ellipse rx="21" ry="28" fill="url(#bskin)"/>
      <ellipse cx="-7" cy="-10" rx="6" ry="11" fill="#B98FA8" opacity=".18" transform="rotate(-18)"/>
      <ellipse cy="-26" rx="6.5" ry="3.5" fill="#D89B33"/>
    </g>
  </g>
</svg>
