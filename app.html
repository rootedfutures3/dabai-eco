<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登入｜TANJU 平台</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png?v=ed84a8a8">
<link rel="apple-touch-icon" href="assets/img/logo-180.png?v=ed84a8a8">
<link rel="stylesheet" href="assets/style.css?v=ed84a8a8">
<script src="assets/config.js?v=ed84a8a8" defer></script>
<script src="assets/auth-sb.js?v=ed84a8a8" defer></script>
<script src="assets/store.js?v=ed84a8a8" defer></script>
<script src="assets/site.js?v=ed84a8a8" defer></script>
<script src="assets/auth.js?v=ed84a8a8" defer></script>
<script src="assets/lang/ms.js?v=ed84a8a8" defer></script>
<script src="assets/lang/en.js?v=ed84a8a8" defer></script>
<script src="assets/lang/iba.js?v=ed84a8a8" defer></script>
<script src="assets/i18n.js?v=ed84a8a8" defer></script>
</head>
<body class="auth-page">

<div class="auth" id="auth">

  <!-- 左：品牌側 -->
  <aside class="auth-brand">
    <div class="orbs" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="drift" aria-hidden="true" id="drift"></div>

    <a class="auth-back" href="index.html">← 回官網</a>

    <div class="auth-brand-in">
      <img src="assets/img/logo.png?v=ed84a8a8" alt="ROOTED FUTURES" width="96" height="96">
      <h1>把根扎在原鄉，<br>讓收成有人接住</h1>
      <p>一樹一碼的果農 × 收購商媒合系統。<br>Song, Sarawak</p>

      <ul class="auth-points">
        <li><b>36</b><span>棵示範果樹</span></li>
        <li><b>3</b><span>原鄉三寶</span></li>
        <li><b>55%</b><span>認養金直達果農</span></li>
      </ul>
    </div>
  </aside>

  <!-- 右：表單側 -->
  <main class="auth-form">
    <div class="auth-card">

      <div class="auth-head">
        <span class="eyebrow">Platform Login</span>
        <h2 id="form-title">登入平台</h2>
        <p class="auth-sub" id="form-sub">用你的帳號進入果農或收購商後台</p>
      </div>

      <div class="sim-note">
        🧪 <b>示範系統</b> —— 沒有伺服器，帳號與資料只存在<b>這台瀏覽器</b>。
        請<b>不要使用真實密碼</b>。
      </div>

      <!-- 登入 -->
      <div class="pane on" data-gate="login">
        <div class="demo-cred" id="demo-cred">預設帳號 <b>admin</b> ／ 密碼 <b>admin</b></div>

        <form id="login-form" autocomplete="on">
          <div id="fld-email" hidden>
            <label for="g-email">Email</label>
            <input id="g-email" name="email" type="email" autocomplete="username"
                   placeholder="you@example.com">
          </div>
          <div id="fld-user">
            <label for="g-user">帳號</label>
            <input id="g-user" name="u" type="text" autocomplete="username"
                   placeholder="admin" value="admin" required>
          </div>
          <div>
            <label for="g-pass">密碼</label>
            <input id="g-pass" name="pass" type="password" autocomplete="current-password"
                   placeholder="admin" value="admin" required>
          </div>
          <button class="btn btn-gold auth-submit" type="submit">
            <span>登入平台</span>
          </button>
        </form>

        <!-- Google 登入只在真正的 Auth 模式下有意義，示範模式會隱藏 -->
        <div id="oauth-block" hidden>
          <div class="or-line"><span>或</span></div>
          <button class="btn-google" type="button" id="google-signin">
            <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true">
              <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
              <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
              <path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/>
              <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
            </svg>
            <span>用 Google 帳號登入</span>
          </button>
          <p class="fld-hint" style="text-align:center;margin-top:10px">
            密碼由 Google 驗證，不會經過這個網站。
          </p>
        </div>

        <div class="form-error" id="login-err" role="alert"></div>

        <div class="quick" id="quick-demo">
          <span>或直接以示範身分進入</span>
          <div class="quick-row">
            <button data-quick="admin"><b>⚙️</b>平台管理員</button>
            <button data-quick="farmer"><b>🌱</b>果農</button>
            <button data-quick="buyer"><b>🏭</b>收購商</button>
          </div>
        </div>

        <button class="btn-back" data-goto="register">還沒有帳號？註冊一個 →</button>
      </div>

      <!-- 註冊 -->
      <div class="pane" data-gate="register">
        <form id="reg-form">
          <div>
            <label for="r-role">我的身分</label>
            <select id="r-role" name="role">
              <option value="farmer">🌱 果農 —— 我有果樹要上架</option>
              <option value="buyer">🏭 收購商 —— 我要認養果樹</option>
            </select>
          </div>
          <div id="fld-reg-email" hidden>
            <label for="r-email">Email</label>
            <input id="r-email" name="email" type="email" placeholder="you@example.com">
            <p class="fld-hint">登入時用這個 Email，不是帳號。</p>
          </div>
          <div class="form-row">
            <div>
              <label for="r-user">帳號</label>
              <input id="r-user" name="u" type="text" placeholder="英數字 3–20 碼" required>
            </div>
            <div>
              <label for="r-pass">密碼</label>
              <input id="r-pass" name="pass" type="password"
                     placeholder="示範用，勿用真實密碼" required>
              <p class="fld-hint" id="r-pass-hint" hidden>至少 6 個字元。</p>
            </div>
          </div>
          <div class="form-row">
            <div>
              <label for="r-name">姓名</label>
              <input id="r-name" name="name" type="text" required>
            </div>
            <div>
              <label for="r-org">果園 / 公司</label>
              <input id="r-org" name="org" type="text" required>
            </div>
          </div>
          <div class="form-row">
            <div>
              <label for="r-phone">電話</label>
              <input id="r-phone" name="phone" type="tel" placeholder="+60 12-345 6789">
            </div>
            <div>
              <label for="r-area">所在地區</label>
              <input id="r-area" name="area" type="text" placeholder="例如：Song">
            </div>
          </div>
          <button class="btn btn-gold auth-submit" type="submit"><span>建立帳號並登入</span></button>
        </form>
        <div class="form-error" id="reg-err" role="alert"></div>
        <button class="btn-back" data-goto="login">← 已經有帳號，回登入</button>
      </div>

    </div>
  </main>
</div>

<!-- 登入成功的轉場 -->
<div class="handoff" id="handoff" aria-hidden="true">
  <img src="assets/img/logo.png?v=ed84a8a8" alt="" width="88" height="88">
  <p id="handoff-text">正在進入平台…</p>
  <div class="handoff-bar"><i></i></div>
</div>

</body>
</html>
